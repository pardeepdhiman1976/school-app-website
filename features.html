<script>
// Highlight the current page and gently reveal content as visitors scroll.
document.querySelectorAll('nav a').forEach(link => {
  if (link.getAttribute('href') === location.pathname.split('/').pop()) link.classList.add('active');
});
const revealItems = document.querySelectorAll('main section, .card');
revealItems.forEach(item => item.classList.add('reveal'));
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
  }, { threshold: 0.08 });
  revealItems.forEach(item => observer.observe(item));
} else { revealItems.forEach(item => item.classList.add('visible')); }
</script>
